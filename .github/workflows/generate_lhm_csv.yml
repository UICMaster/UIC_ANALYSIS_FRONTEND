name: Generate LHM CSV Export

on:
  schedule:
    - cron: '0 2 * * *' # Runs automatically every day at 02:00 UTC
  workflow_dispatch:    # Allows you to trigger it manually

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    
    # Grants the Action permission to push the generated file back to your repo
    permissions:
      contents: write 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Convert JSON to CSV
        run: python json_to_csv.py

      - name: Commit and Push CSV
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add players.csv
          
          # Only commits if there is new data to save
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update LHM players.csv" && git push)
